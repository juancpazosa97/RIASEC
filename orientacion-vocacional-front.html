<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Orientación Vocacional RIASEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna de lectura (máx. 880px), tarjetas solo donde hay acción o resultado.
   Paleta fría: azul pizarra como neutro, azul marino como acento institucional. Los colores de
   dimensión (R I A S E C) son la paleta categórica validada (slots 1 a 6) y no se reutilizan para otra cosa. */
:root {
  --bg: #f2f5f9;
  --surface: #ffffff;
  --surface-2: #e9eef5;
  --ink: #0f1f30;
  --ink-2: #4a5c70;
  --ink-3: #6b7c90;
  --line: #d6dfe9;
  --accent: #14385c;
  --accent-ink: #ffffff;
  --accent-soft: #dfe9f6;
  --focus: #2a78d6;
  --warn-bg: #fff4dc;
  --warn-ink: #6a4700;
  --err: #b3261e;
  --ok: #0b6b3a;
  --band: rgba(20, 56, 92, 0.10);
  --c-R: #2a78d6; --c-I: #eb6834; --c-A: #1baf7a; --c-S: #eda100; --c-E: #e87ba4; --c-C: #008300;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620; --surface: #16212d; --surface-2: #1e2c3b; --ink: #e8eef5; --ink-2: #b5c3d2; --ink-3: #8c9db0;
    --line: #2b3b4d; --accent: #8fb8e8; --accent-ink: #0e1620; --accent-soft: #1d3149; --focus: #6fa8ee;
    --warn-bg: #3a2d10; --warn-ink: #f2cf8a; --err: #ff8d84; --ok: #6fd69b; --band: rgba(143, 184, 232, 0.14);
    --c-R: #3987e5; --c-I: #d95926; --c-A: #199e70; --c-S: #c98500; --c-E: #d55181; --c-C: #008300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1620; --surface: #16212d; --surface-2: #1e2c3b; --ink: #e8eef5; --ink-2: #b5c3d2; --ink-3: #8c9db0;
  --line: #2b3b4d; --accent: #8fb8e8; --accent-ink: #0e1620; --accent-soft: #1d3149; --focus: #6fa8ee;
  --warn-bg: #3a2d10; --warn-ink: #f2cf8a; --err: #ff8d84; --ok: #6fd69b; --band: rgba(143, 184, 232, 0.14);
  --c-R: #3987e5; --c-I: #d95926; --c-A: #199e70; --c-S: #c98500; --c-E: #d55181; --c-C: #008300;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 880px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.3rem, 3.2vw, 1.7rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

header.top { padding-block: 28px 8px; display: grid; gap: 14px; }
.brand { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.stepper { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-3); font-weight: 600; }
.stepper span { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.stepper span.on { background: var(--accent); color: var(--accent-ink); }
.stepper span.done { color: var(--ink-2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 4vw, 32px); display: grid; gap: 18px; margin-top: 16px; }
.lead { color: var(--ink-2); max-width: 62ch; }
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 12px 14px; font-size: 0.92rem; }
.note.info { background: var(--accent-soft); color: var(--ink); }

label.field { display: grid; gap: 6px; font-weight: 600; font-size: 0.95rem; }
input[type="text"], input[type="number"] {
  font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0;
}
input[type="text"]:focus, input[type="number"]:focus { border-color: var(--focus); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.err { color: var(--err); font-size: 0.88rem; font-weight: 600; }
.hint { color: var(--ink-3); font-size: 0.88rem; font-weight: 500; }

button { font: inherit; cursor: pointer; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }

.consent { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--bg); display: grid; gap: 10px; font-size: 0.92rem; }
.consent b { color: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; font-size: 0.95rem; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }

/* Escala */
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.q { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; background: var(--surface); }
.q.missing { border-color: var(--err); }
.q .qn { font-size: 0.8rem; font-weight: 700; color: var(--ink-3); letter-spacing: 0.06em; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { text-align: left; background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; line-height: 1.4; min-width: 0; }
.opt small { font-weight: 700; color: var(--ink-3); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }
.opt:hover { border-color: var(--ink-3); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--bg); color: var(--ink-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 0.88rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 560px) { .pair { grid-template-columns: 1fr; } }

fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-weight: 700; padding: 0; margin-bottom: 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices label { display: inline-flex; gap: 8px; align-items: center; background: var(--bg); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
.choices label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choices input { accent-color: var(--accent); }

/* Resultados */
.res-head { display: grid; gap: 8px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.chartbox { display: grid; gap: 10px; min-width: 0; }
.chartbox h3 { font-size: 1rem; }
svg.radar { width: 100%; height: auto; max-width: 560px; margin: 0 auto; display: block; }
svg.radar text { font-family: var(--font-body); fill: var(--ink); }
.bars { display: grid; gap: 14px; }
.brow { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; }
.brow .bl { font-weight: 700; font-size: 0.9rem; line-height: 1.2; }
.brow .bl span { display: block; font-weight: 500; color: var(--ink-3); font-size: 0.78rem; }
.track { background: var(--surface-2); border-radius: 4px; height: 26px; position: relative; }
.fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 3px; display: block; opacity: 0.9; }
.whisk-unused { position: absolute; top: 50%; height: 2px; background: var(--ink); transform: translateY(-50%); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); box-sizing: border-box; min-width: 4px; }
.ref { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--ink-3); }
.axis-note { font-size: 0.8rem; color: var(--ink-3); }

table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.tablewrap td:first-child { white-space: nowrap; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }

.iav { display: grid; gap: 14px; }
.iav .big { font-family: var(--font-display); font-size: clamp(2.4rem, 8vw, 3.4rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge { position: relative; height: 14px; background: var(--surface-2); border-radius: 999px; margin: 18px 0 26px; }
.gauge .band { position: absolute; top: 0; bottom: 0; background: var(--band); border-left: 1.5px solid var(--ink-3); border-right: 1.5px solid var(--ink-3); }
.gauge .mark { position: absolute; top: -6px; width: 4px; height: 26px; background: var(--accent); border-radius: 2px; transform: translateX(-2px); }
.gauge .tick { position: absolute; top: 20px; font-size: 0.75rem; color: var(--ink-3); transform: translateX(-50%); }
.ind { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.ind > div { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; min-width: 0; }
.ind .v { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ind .k { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.tag { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); width: fit-content; }
.dimlist { display: grid; gap: 10px; }
.dimlist > div { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.dimlist .sw { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; font-family: var(--font-display); }
.foot { margin-top: 28px; font-size: 0.82rem; color: var(--ink-3); display: grid; gap: 4px; }
#tip { position: fixed; pointer-events: none; z-index: 30; background: var(--ink); color: var(--bg); font-size: 0.82rem; padding: 6px 10px; border-radius: 8px; max-width: 240px; opacity: 0; transition: opacity .1s; }

.toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.titles { display: grid; gap: 14px; min-width: 0; }
.logochip { flex: none; background: #fff; border-radius: 12px; padding: 8px 12px; border: 1px solid var(--line); }
.logo { display: block; width: 150px; height: auto; max-width: 100%; }
@media (max-width: 560px) { .logo { width: 104px; } .logochip { padding: 6px 8px; } }
.tag.lv-up { background: var(--accent); color: var(--accent-ink); }
.dimlist .tag { margin-left: 6px; vertical-align: 1px; }
.gauge4 { position: relative; display: flex; gap: 3px; margin: 14px 0 34px; }
.gauge4 .seg { position: relative; height: 12px; }
.gauge4 .seg i { display: block; height: 100%; background: var(--surface-2); border-radius: 4px; }
.gauge4 .seg.on i { background: var(--accent); opacity: 0.35; }
.gauge4 .seg span { position: absolute; top: 18px; left: 0; right: 0; font-size: 0.75rem; color: var(--ink-3); line-height: 1.2; text-align: center; }
.gauge4 .seg.on span { color: var(--ink); font-weight: 700; }
.mark4 { position: absolute; top: -5px; width: 4px; height: 22px; background: var(--accent); border-radius: 2px; transform: translateX(-2px); }
.career { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; background: var(--bg); }
.chips2 { display: flex; flex-wrap: wrap; gap: 8px; }
.chips2 span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; font-weight: 600; }
@media print { header.top .stepper, .actions, #tip { display: none !important; } body { background: #fff; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

  <header class="top">
    <div class="toprow">
      <div class="titles">
        <div class="brand" id="brand"></div>

// Factor de Cholesky L (S = L L') para generar dimensiones correlacionadas a partir de normales independientes
function cholesky(S) {
  const n = S.length, L = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
    let s = S[i][j]; for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
    L[i][j] = i === j ? Math.sqrt(s) : s / L[j][j];
  }
  return L;
}
// Inversa de la normal estándar (Acklam)
function invNorm(p) {

        d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416], pl = 0.02425;
  let q, r;

function halton(i, base) { let f = 1, r = 0; while (i > 0) { f /= base; r += f * (i % base); i = Math.floor(i / base); } return r; }

/* Nodos cuasi-aleatorios (Halton) de la distribución latente N(0, cor): equivale al método QMC de mirt.

const N_NODES = 100000;

    for (let k = 0; k < 6; k++) { let s = 0; for (let j = 0; j <= k; j++) s += L[k][j] * z[j]; th[i * 6 + k] = s; }
  }
  for (let j = 0; j < 30; j++) {
    const e = new Float64Array(N_NODES);
    for (let i = 0; i < N_NODES; i++) { let s = 0; for (let k = 0; k < 6; k++) s += GRM.a[j][k] * th[i * 6 + k]; e[i] = s; }
    eta.push(e);

}
// Codificación de la respuesta: prefiere A = 0, ambigua (A y B, Neutral, Ni A ni B) = 1, prefiere B = 2
function codeResp(r) { return r === "A" ? 0 : r === "B" ? 2 : 1; }

function computeScores(ans) {
  if (!NODES) buildNodes();

  for (let p = 1; p <= 30; p++) {
    const j = HOL[p] - 1, y = codeResp(ans[p]), d1 = GRM.d1[j], d2 = GRM.d2[j], e = eta[j];
    for (let i = 0; i < N_NODES; i++) {
      const p1 = 1 / (1 + Math.exp(-(e[i] + d1))), p2 = 1 / (1 + Math.exp(-(e[i] + d2)));
      const pr = y === 0 ? 1 - p1 : y === 1 ? p1 - p2 : p2;

    eap[d] = m1[k] / sw; se[d] = Math.sqrt(Math.max(0, m2[k] / sw - eap[d] * eap[d]));
    T[d] = 50 + 10 * eap[d]; lo[d] = T[d] - 1.96 * 10 * se[d]; hi[d] = T[d] + 1.96 * 10 * se[d];

  const [d1, d2] = order;

  // dividida por el error estándar de la diferencia (errores independientes, criterio aproximado)
  const z12 = (T[d1] - T[d2]) / Math.sqrt(Math.pow(10 * se[d1], 2) + Math.pow(10 * se[d2], 2));

    eap, se, T, lo, hi, order, z12, distinct: z12 > 1.96,
    range: T[order[0]] - T[order[5]],
    iav: amb / 30 * 100, iavCount: amb

}

/* ---------- Paso 2: escala ---------- */
const MODES = [["AB", "A y B"], ["NEUTRAL", "Neutral"], ["NONE", "Ni A ni B"]];
function viewScale() {
  const pages = Math.ceil(30 / PER_PAGE), start = state.page * PER_PAGE + 1, end = Math.min(start + PER_PAGE - 1, 30);
  const answered = Object.keys(state.answers).length;
  let html = `<section class="card">
    ${state.page === 0 ? `<h2>Escala de preferencias de carrera</h2>
    <p class="lead">Encontrarás 30 proposiciones, cada una con dos opciones opuestas (A y B). Elige la que más te guste. También puedes marcar <b>A y B</b> si te gustan ambas, <b>Neutral</b> si te son indiferentes o <b>Ni A ni B</b> si ninguna te atrae. A partir de la proposición 16 ya no existe la modalidad “A y B”.</p>` : `<h2>Proposiciones ${start} a ${end}</h2>`}
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="30" aria-valuenow="${answered}" aria-label="Respuestas completadas"><i style="width:${answered / 30 * 100}%"></i></div>
    <span class="hint">${answered} de 30 respondidas</span>`;
  for (let p = start; p <= end; p++) {
    const [a, b] = ITEMS[p - 1], v = state.answers[p];
    const modes = p <= 15 ? MODES : MODES.filter(m => m[0] !== "AB");
    html += `<div class="q" id="q${p}" data-p="${p}">
      <div class="qn">PROPOSICIÓN ${p}</div>
      <div class="pair">
        <button class="opt" data-v="A" aria-pressed="${v === "A"}"><small>Opción A</small>${esc(a)}</button>
        <button class="opt" data-v="B" aria-pressed="${v === "B"}"><small>Opción B</small>${esc(b)}</button>
      </div>
      <div class="chips">${modes.map(([k, l]) => `<button class="chip" data-v="${k}" aria-pressed="${v === k}">${l}</button>`).join("")}</div>
    </div>`;
  }
  html += `<span class="err" id="s-err" role="alert"></span>
    <div class="actions"><button class="btn ghost" id="s-back">Atrás</button>
    <button class="btn" id="s-next">${state.page === pages - 1 ? "Finalizar la escala" : "Siguiente"}</button></div></section>`;
  app.innerHTML = html;

  app.querySelectorAll(".q").forEach(q => q.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-v]"); if (!btn) return;
    const p = +q.dataset.p; state.answers[p] = btn.dataset.v;
    q.classList.remove("missing");
    q.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed", x === btn));
    const n = Object.keys(state.answers).length;
    app.querySelector(".progress > i").style.width = (n / 30 * 100) + "%";
    app.querySelector(".hint").textContent = `${n} de 30 respondidas`;
  }));
  $("#s-back").onclick = () => state.page === 0 ? go(1) : go(2, state.page - 1);
  $("#s-next").onclick = () => {
    const missing = []; for (let p = start; p <= end; p++) if (!state.answers[p]) missing.push(p);
    if (missing.length) {
      missing.forEach(p => $("#q" + p).classList.add("missing"));
      $("#s-err").textContent = `Falta responder: ${missing.map(p => "proposición " + p).join(", ")}.`;
      $("#q" + missing[0]).scrollIntoView({ block: "center" }); return;
    }
    state.page === pages - 1 ? go(3) : go(2, state.page + 1);
  };
}

  });

    const q = DEMO.find(x => x.id === inp.name);

    if (q.id === "nivel") app.querySelectorAll("fieldset[data-he]").forEach(f => f.hidden = !HE_LEVELS.includes(d.nivel));
  });
  $("#d-back").onclick = () => go(2, 5);
  $("#d-next").onclick = () => {
    const he = HE_LEVELS.includes(d.nivel);
    const miss = DEMO.filter(q => (!q.he || he) && (q.type === "one" ? !d[q.id] : !(d[q.id] && d[q.id].length)));
    if (miss.length) { $("#d-err").textContent = `Falta responder: ${miss.map(q => q.q.split(" (")[0]).join("; ")}.`; $("#f-" + miss[0].id).scrollIntoView({ block: "center" }); return; }
    if (!he) DEMO.filter(q => q.he).forEach(q => delete d[q.id]);
    // El primer cálculo prepara los nodos de integración (puede tardar un par de segundos)
    $("#d-next").disabled = true; $("#d-next").textContent = "Calculando tu perfil…";
    setTimeout(() => { state.result = computeScores(state.answers); submitRecord(); go(4); }, 40);
  };
}

/* Envío opcional al servidor (ver CONFIG.submitUrl) */
function buildRecord() {
  return {
    consentVersion: CONFIG.consentVersion, finishedAt: new Date().toISOString(),
    age: state.age, minor: state.minor, consent: state.consent,
    answers: state.answers, demographics: state.demo, scores: state.result
  };
}
function submitRecord() {
  if (!CONFIG.submitUrl) { state.sendStatus = ""; return; }
  state.sendStatus = "Enviando tus respuestas…";
  fetch(CONFIG.submitUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(buildRecord()) })
    .then(r => { if (!r.ok) throw new Error(r.status); state.sendStatus = "Tus respuestas fueron registradas en el sistema de la universidad."; })
    .catch(() => { state.sendStatus = "No se pudo registrar tu envío. Tu resultado sigue visible en esta pantalla; avisa al equipo de orientación."; })
    .finally(() => { const el = $("#send-status"); if (el) el.textContent = state.sendStatus; });
}

function radarSVG(r) {
  const cx = 300, cy = 215, R = 140, n = 6;
  const pt = (i, f) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + R * f * Math.cos(a), cy + R * f * Math.sin(a)]; };
  let g = "";
  [35, 50, 65, 80].forEach(t => {
    g += `<polygon points="${DIMS.map((_, i) => pt(i, tpos(t)).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="${t === 50 ? 1.8 : 1}" ${t === 50 ? 'stroke-dasharray="5 4"' : ""}/>`;
  });
  DIMS.forEach((_, i) => { const [x, y] = pt(i, 1); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; });
  g += `<polygon points="${DIMS.map((d, i) => pt(i, tpos(r.T[d])).join(",")).join(" ")}" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  DIMS.forEach((d, i) => {
    const [x, y] = pt(i, tpos(r.T[d]));
    g += `<circle cx="${x}" cy="${y}" r="6" fill="var(--c-${d})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(DIM_INFO[d].name)}: ${fmt(r.T[d], 0)} puntos"/>`;
    const [lx, ly] = pt(i, 1.22), anchor = Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end";
    g += `<text x="${lx}" y="${ly - 2}" text-anchor="${anchor}" font-size="13" font-weight="700">${d} · ${DIM_INFO[d].name}</text>
          <text x="${lx}" y="${ly + 14}" text-anchor="${anchor}" font-size="12" style="fill:var(--ink-2)">${fmt(r.T[d], 0)} puntos</text>`;
  });
  return `<svg class="radar" viewBox="0 0 600 430" role="img" aria-label="Gráfico de araña con tus puntajes: ${DIMS.map(d => DIM_INFO[d].name + " " + fmt(r.T[d], 0)).join(", ")}">${g}</svg>`;
}
function barsHTML(r) {
  return `<div class="bars">` + DIMS.map(d => {
    const p = tpos(r.T[d]) * 100;
    return `<div class="brow"><div class="bl">${d} · ${DIM_INFO[d].name}<span>${fmt(r.T[d], 0)} puntos</span></div>
      <div class="track" data-tip="${esc(DIM_INFO[d].name)}: ${fmt(r.T[d], 0)} puntos">
        <span class="fill" style="width:${p}%;background:var(--c-${d})"></span>
        <span class="ref" style="left:${tpos(50) * 100}%"></span></div></div>`;
  }).join("") + `</div>`;
}

  if ((x === "E" && y === "I") || (x === "I" && y === "E")) {
    const z = r.order[2];
    intro = `Tus dos dimensiones más altas son ${DIM_INFO[x].name} y ${DIM_INFO[y].name}. Estas dos no apuntan a un solo ambiente de trabajo, por eso tomamos también tu tercera dimensión, ${DIM_INFO[z].name}, para sugerirte áreas.`;
    [pcode("E", z), pcode(z, "E"), pcode("I", z), pcode(z, "I")].forEach(c => { if (PROFILES[c]) list.push({ code: c, kind: "main" }); });
  } else {
    const direct = pcode(x, y), inverse = pcode(y, x);
    intro = `Tus dos dimensiones más altas son ${DIM_INFO[x].name} (${fmt(r.T[x], 0)} puntos) y ${DIM_INFO[y].name} (${fmt(r.T[y], 0)} puntos).`;
    if (PROFILES[direct]) { list.push({ code: direct, kind: "main" }); if (PROFILES[inverse]) list.push({ code: inverse, kind: "inv" }); }
    else if (PROFILES[inverse]) list.push({ code: inverse, kind: "main" });
  }
  return { intro, list };
}

  <section class="card iav">

    </div>
    <p><b>${band.name}.</b> ${band.msg}</p>

  </section>

  <section class="card">
    <h2>Carreras y áreas que podrían interesarte</h2>

    ${plan.list.map(({ code, kind }) => `<div class="career">
      <h3>${kind === "inv" ? "También podrían gustarte (perfil inverso): " : ""}${ptitle(code)}</h3>

/* Tooltips de los gráficos */
function attachTips() {
  const tip = $("#tip");
  app.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", (e) => { tip.textContent = el.dataset.tip; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - 250) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
    el.addEventListener("mouseleave", () => tip.style.opacity = 0);
  });
}
